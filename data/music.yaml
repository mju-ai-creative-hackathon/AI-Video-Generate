# 배경 음악 목록. 템플릿의 audio.music과 제작 요청의 musicId가 여기 id를 가리킨다.
# 라이선스를 확보한 곡만 넣는다(상업적 이용, 2차 저작물 허용, 출처 표기 조건을 license에 적는다).
# 파일은 assets/music/에 둔다. 이 폴더는 git에 올리지 않는다.
# 파일이 없는 곡은 선택지에 나오지 않고, 그 곡을 고른 스토리보드는 승인할 때 오류가 난다.
#
# 예:
# tracks:
#   - id: calm_piano_01
#     name: 잔잔한 피아노
#     file: assets/music/calm_piano_01.mp3
#     license: "OO 라이선스, 상업적 이용 가능, 출처 표기 불필요 (확인: 홍길동, 2026-11-06)"
#     moods: [잔잔함, 따뜻함]
#     bpm: 96
tracks:
  # 시연 전용. 사용 허가를 받지 않은 곡이다. 공개 배포(앱 출시, SNS 게시) 전에 반드시 교체한다.
  - id: roi_instrumental_demo
    name: "Roi (Instrumental) [시연용]"
    file: assets/music/roi_instrumental_demo.m4a
    license: >-
      미허가. instagram.com/reels/DT6pagyDx9K 의 배경 음악을 사용자 요청으로 추출(2026-11-06).
      해커톤 내부 시연 전용, 공개 배포 금지, 공개 전 교체 필요. 원본 24.2초 구간이라 긴 영상에서는 반복된다.
    moods: [잔잔함, 설렘]
