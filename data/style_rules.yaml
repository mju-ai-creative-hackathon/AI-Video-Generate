# 대본 말투 규칙. 대본 데이터를 RAG로 쓰지 않으므로 품질은 이 규칙과 사람 수정에 의존한다.
tone: 친구에게 이야기하듯 편한 반말
rules:
  - 한 컷의 나레이션은 한 문장을 기본으로 하고, 소리 내어 읽기 좋게 짧게 쓴다.
  - 사진에 보이는 구체적인 디테일 하나를 넣는다.
  - 설명보다 그 순간의 감상을 말한다.
  - 같은 어미를 세 컷 넘게 연속으로 쓰지 않는다.
  - 화면 문구는 나레이션을 반복하지 않고 12자 이내의 핵심 단어로 쓴다.
forbidden:
  - 사진과 메모에 없는 사실(맛, 장소명, 동행인, 가격, 날짜)을 지어내지 않는다.
  - 광고 문구나 과장된 표현(인생 최고, 무조건, 역대급)을 쓰지 않는다.
  - 이모지와 해시태그를 쓰지 않는다.
