# 임시 템플릿. "특정 영상을 옮겨 적지 않는다"는 계획의 예외로, 사용자 요청에 따라 만들었다.
# 참고 영상: instagram.com/reel/DT6pagyDx9K (2026-11-06 분석). 컷 구조만 옮겼고 원본 문장은 넣지 않았다.
# 원본은 24.2초, 19컷. 첫 컷 2.3초, 마지막 컷 2.1초, 나머지는 1.1~1.3초로 고르게 끊긴다(음악 박자에 맞춘 것으로 보임).
# 컷 경계는 ffmpeg 장면 감지(0.18), 나머지는 컷별 프레임 한 장씩 보고 판단했다(소리는 듣지 않음).
# 흐름: 큰 제목 → 이동(창밖) → 도착 표지 → 밤 → 해 뜰 무렵 거리·바다 → 동네 골목·소품 → 먹거리
#   → 바다 전망 명소 → 다시 창밖으로 끝(첫 이동 컷과 짝을 이룸).
# 원본은 첫 컷에만 큰 제목(수식어 / 영문 지명 / 부제 3줄)이 있고 나머지는 화면 문구가 없다.
# 음악 전용(audio.mode: music): 나레이션과 TTS 없이 음악만 넣고, 컷 길이는 아래 sec를 그대로 따른다.
#   기본 음악은 비워 뒀다. data/music.yaml에 곡을 등록한 뒤 music에 id를 적거나, 제작 요청에서 고른다.
# 재현하지 못한 것:
#   - 음악 박자에 맞춘 컷 전환: 컷 길이를 원본과 비슷하게 맞췄을 뿐 박자를 분석하지는 않는다.
#   - 제목의 3줄 손글씨 스타일과 색: 화면 문구 한 줄로 대체.
# 미션 제출(파일 하나당 컷 하나)에서는 첫 컷 hook, 마지막 컷 ending, 나머지는 아래 body 슬롯을
#   순서대로 고르게 나눠 쓴다(repeat은 CLI 자동 구성에서만 쓰인다).
format_id: reel_mood_trip_temp_v1
name: 감성 여행 몽타주
hook_type: 장소 제시형
total_sec: {min: 5, max: 40}
audio:
  mode: music
  music: null
slots:
  # 원본 #1: 바다로 이어지는 거리 위에 큰 제목
  - slot: hook
    role: hook
    sec: {min: 2.3, max: 2.4}
    photo_need:
      prefer: [풍경]
      moods: []
    shot_options:
      - {size: wide, move: static}
      - {size: wide, move: slow_push_in}
    text: {use: required, position: top}
  # 원본 #2: 이동 수단의 창밖 풍경
  - slot: depart
    role: body
    required: false
    repeat: {min: 0, max: 1}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [풍경, 실내]
      moods: []
    shot_options:
      - {size: medium, move: static}
      - {size: wide, move: static}
    text: {use: none, position: top}
  # 원본 #3: 역 이름 같은 도착 표지
  - slot: arrive
    role: body
    required: false
    repeat: {min: 0, max: 1}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [사물, 풍경]
      moods: []
    shot_options:
      - {size: medium, move: static}
      - {size: wide, move: tilt_up}
    text: {use: none, position: top}
  # 원본 #4: 첫날 밤 풍경
  - slot: night
    role: body
    required: false
    repeat: {min: 0, max: 1}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [풍경]
      moods: [잔잔함]
    shot_options:
      - {size: wide, move: static}
    text: {use: none, position: top}
  # 원본 #5~#7: 해 뜰 무렵의 거리와 바다
  - slot: morning
    role: body
    repeat: {min: 1, max: 3}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [풍경]
      moods: [잔잔함, 따뜻함]
    shot_options:
      - {size: wide, move: static}
      - {size: wide, move: pan_right}
    text: {use: none, position: top}
  # 원본 #8~#10: 동네 골목, 생활감 있는 디테일, 소품
  - slot: alley
    role: body
    required: false
    repeat: {min: 0, max: 3}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [사물, 풍경]
      moods: []
    shot_options:
      - {size: medium, move: handheld}
      - {size: close_up, move: static}
      - {size: detail, move: static}
    text: {use: none, position: top}
  # 원본 #11, #12: 빵과 음식
  - slot: food
    role: body
    required: false
    repeat: {min: 0, max: 2}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [음식]
      moods: []
    shot_options:
      - {size: close_up, move: slow_push_in}
      - {size: detail, move: static}
    text: {use: none, position: top}
  # 원본 #13~#15: 바다가 내려다보이는 명소와 건물
  - slot: view
    role: body
    repeat: {min: 1, max: 3}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [풍경]
      moods: []
    shot_options:
      - {size: wide, move: static}
      - {size: medium, move: slow_push_in}
    text: {use: none, position: top}
  # 원본 #16~#18: 산책길, 뒷모습, 바다 위 작은 풍경
  - slot: walk
    role: body
    required: false
    repeat: {min: 0, max: 3}
    sec: {min: 1.1, max: 1.3}
    photo_need:
      prefer: [풍경, 인물]
      moods: [잔잔함]
    shot_options:
      - {size: wide, move: handheld}
      - {size: wide, move: static}
    text: {use: none, position: top}
  # 원본 #19: 돌아가는 창밖. 두 번째 컷(창밖)과 짝을 이루는 마무리
  - slot: ending
    role: ending
    sec: {min: 2.0, max: 2.2}
    photo_need:
      prefer: [풍경, 실내]
      moods: []
    shot_options:
      - {size: medium, move: static}
      - {size: wide, move: pull_out}
    text: {use: none, position: top}
