spring.application.name=backend

server.port=${SERVER_PORT:8080}

# Docker Compose로 실행되는 로컬 PostgreSQL 기본값
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackathon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 개발 단계 설정. 운영 환경에서는 validate와 Flyway 사용을 권장합니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 운영 환경에서는 반드시 충분히 긴 무작위 값으로 변경하세요.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-production-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
