spring.application.name=backend

server.port=${SERVER_PORT:8080}

# Local PostgreSQL defaults (Docker Compose uses port 5433).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hackathon}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use a long random secret in production.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-before-production-2026}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.refresh-token.expiration-seconds=${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# Web application type OAuth client ID used as the iOS backend/server client ID.
app.google.server-client-id=${GOOGLE_SERVER_CLIENT_ID:191486826471-hj88egpu3at3trb0uo5m08q7md915t5a.apps.googleusercontent.com}

# Seed Seoul sample places only when the place table is empty.
app.seed.places.enabled=${SEED_PLACES_ENABLED:true}
