# 테스트는 Docker 실행 여부와 관계없이 메모리 DB를 사용합니다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long
app.jwt.expiration-seconds=3600
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.oauth2.frontend-success-url=http://localhost:3000/oauth/callback
app.oauth2.frontend-failure-url=http://localhost:3000/login
app.seed.places.enabled=false
